<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MFS Project Structure Flow</title>
  <style>
    :root {
      --bg: #f7f8fb;
      --panel: #ffffff;
      --text: #202939;
      --muted: #667085;
      --line: #d8dee8;
      --soft: #f2f5f9;
      --active: #1456cc;
      --active-bg: #eaf2ff;
      --done-bg: #eef8f3;
      --client: #0f766e;
      --protocol: #5b21b6;
      --server: #9a3412;
      --deploy: #475467;
      --shadow: 0 1px 2px rgba(16, 24, 40, 0.08), 0 8px 24px rgba(16, 24, 40, 0.06);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.5;
    }

    header {
      padding: 22px 28px 16px;
      background: var(--panel);
      border-bottom: 1px solid var(--line);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 22px;
      letter-spacing: 0;
    }

    .subtitle {
      margin: 0;
      max-width: 1120px;
      color: var(--muted);
      font-size: 14px;
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(560px, 1fr) 430px;
      gap: 18px;
      padding: 18px;
      min-height: calc(100vh - 92px);
    }

    .panel {
      min-width: 0;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
    }

    .toolbar {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      padding: 14px;
      background: var(--panel);
      border-bottom: 1px solid var(--line);
      border-radius: 8px 8px 0 0;
    }

    .group {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .label {
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    button {
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--panel);
      color: var(--text);
      padding: 7px 10px;
      font-size: 13px;
      cursor: pointer;
    }

    button:hover {
      border-color: var(--active);
    }

    button.active {
      background: var(--active);
      border-color: var(--active);
      color: #ffffff;
    }

    .tree {
      overflow: auto;
      padding: 14px 0 18px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
      font-size: 13px;
      line-height: 1.58;
    }

    .tree-line {
      min-width: 980px;
      padding: 2px 14px;
      white-space: pre;
      border-left: 4px solid transparent;
      cursor: pointer;
      transition: background 140ms ease, opacity 140ms ease, transform 140ms ease;
    }

    .tree-line:hover {
      background: var(--soft);
    }

    .comment {
      color: #617083;
    }

    .tree-line.dimmed {
      opacity: 0.24;
    }

    .tree-line.path-active {
      opacity: 1;
      background: #fbfdff;
    }

    .tree-line.done {
      background: var(--done-bg);
    }

    .tree-line.current {
      opacity: 1;
      background: var(--active-bg);
      border-left-color: var(--active);
      transform: translateX(2px);
      animation: pulse 1.15s ease-in-out infinite;
    }

    .tree-line.current.client {
      border-left-color: var(--client);
    }

    .tree-line.current.protocol {
      border-left-color: var(--protocol);
    }

    .tree-line.current.server {
      border-left-color: var(--server);
    }

    .tree-line.current.deploy {
      border-left-color: var(--deploy);
    }

    .tree-line.delivery {
      opacity: 1;
      background: #fbfcff;
    }

    .tree-line.selected {
      outline: 1px solid rgba(20, 86, 204, 0.35);
      outline-offset: -1px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 20px;
      height: 20px;
      margin-left: 8px;
      border-radius: 999px;
      background: var(--active);
      color: #ffffff;
      font-family: ui-sans-serif, system-ui, sans-serif;
      font-size: 11px;
      font-weight: 700;
    }

    @keyframes pulse {
      0%, 100% {
        box-shadow: inset 0 0 0 0 rgba(20, 86, 204, 0.18);
      }
      50% {
        box-shadow: inset 0 0 0 999px rgba(20, 86, 204, 0.06);
      }
    }

    .side {
      display: flex;
      flex-direction: column;
      gap: 14px;
      min-width: 0;
    }

    .side-section {
      padding: 16px;
    }

    .side h2 {
      margin: 0 0 8px;
      font-size: 16px;
    }

    .side p {
      margin: 0 0 10px;
      color: var(--muted);
      font-size: 14px;
    }

    .progress {
      height: 6px;
      overflow: hidden;
      margin: 8px 0 12px;
      background: #edf1f7;
      border-radius: 999px;
    }

    .progress-bar {
      width: 0;
      height: 100%;
      background: var(--active);
      transition: width 180ms ease;
    }

    .step-controls,
    .filter-host {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 12px 0;
    }

    .steps {
      list-style: none;
      margin: 0;
      padding: 0;
      font-size: 14px;
    }

    .steps li {
      display: grid;
      grid-template-columns: 26px 1fr;
      gap: 8px;
      padding: 8px;
      margin: 6px 0;
      border: 1px solid transparent;
      border-radius: 6px;
      cursor: pointer;
    }

    .steps li:hover {
      background: var(--soft);
    }

    .steps li.current {
      border-color: rgba(20, 86, 204, 0.35);
      background: var(--active-bg);
    }

    .steps li.done {
      background: var(--done-bg);
    }

    .step-num {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 22px;
      height: 22px;
      border-radius: 999px;
      background: #e4e8f0;
      font-size: 12px;
      font-weight: 700;
    }

    .steps li.current .step-num {
      background: var(--active);
      color: #ffffff;
    }

    .step-path {
      display: block;
      margin-bottom: 2px;
      color: #344054;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      word-break: break-all;
    }

    .node-path {
      margin-top: 8px;
      padding: 8px;
      border-radius: 6px;
      background: #f6f8fb;
      color: #344054;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      word-break: break-all;
    }

    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
      color: var(--muted);
      font-size: 12px;
    }

    .legend span {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .swatch {
      width: 10px;
      height: 10px;
      border-radius: 2px;
      background: var(--server);
    }

    .swatch.client {
      background: var(--client);
    }

    .swatch.protocol {
      background: var(--protocol);
    }

    .swatch.deploy {
      background: var(--deploy);
    }

    .delivery-summary {
      display: none;
      margin-top: 12px;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #f8fafc;
      color: var(--muted);
      font-size: 13px;
    }

    .delivery-summary strong {
      color: var(--text);
    }

    @media (max-width: 980px) {
      .layout {
        grid-template-columns: 1fr;
      }

      .side {
        order: -1;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>MFS 项目目录结构与信息流</h1>
    <p class="subtitle">目录树展示关键分层；重复命令、source 和 provider 用 `...` 汇总。Flow 视图看请求如何经过 client、HTTP、server、source、object、pipeline、storage；PyPI/Docker 视图看交付边界。</p>
  </header>

  <main class="layout">
    <section class="panel">

        <div class="group">
          <span class="label">信息流</span>
          <div class="group" id="flowButtons"></div>
        </div>
        <div class="group">
          <span class="label">交付视图</span>
          <button id="viewFlow" type="button">Flow</button>
          <button id="viewPypi" type="button">PyPI</button>
          <button id="viewDocker" type="button">Docker</button>
        </div>
      </div>
      <div class="tree" id="tree"></div>
    </section>

    <aside class="side">
      <section class="panel side-section">
        <h2 id="flowTitle"></h2>
        <p id="flowSummary"></p>
        <div class="progress"><div class="progress-bar" id="progressBar"></div></div>
        <div class="step-controls">
          <button id="prevStep" type="button">上一步</button>
          <button id="nextStep" type="button">下一节点</button>
          <button id="playSteps" type="button">播放</button>
          <button id="showAll" type="button">显示全路径</button>
        </div>
        <ol class="steps" id="flowSteps"></ol>
        <div class="delivery-summary" id="deliverySummary"></div>
        <div class="filter-host" id="deliveryFilters"></div>
        <div class="legend">
          <span><i class="swatch client"></i>client</span>
          <span><i class="swatch protocol"></i>protocol</span>
          <span><i class="swatch"></i>server</span>
          <span><i class="swatch deploy"></i>deploy</span>
        </div>
      </section>

      <section class="panel side-section">
        <h2>节点说明</h2>
        <div id="nodeDetail">点击左侧目录或文件查看职责。</div>
      </section>
    </aside>
  </main>

      ["deploy_docker_worker", "│   ├── docker/mfs-worker.Dockerfile", "只跑 worker", "deploy", ["img-worker"]],
      ["deploy_more", "│   └── compose/ helm/ systemd/", "compose、Kubernetes、VM 部署示例", "deploy", ["img-server", "img-api", "img-worker"]],
      ["tests", "├── tests/", "client/server/source/e2e/fixture 测试", "deploy", ["test"]],
      ["docs", "└── docs/ skills/ tmp/refactor-design/", "正式文档、Agent Skill、设计文档", "deploy", ["docs"]]
    ].map(([id, line, comment, zone, tags]) => ({ id, line, comment, zone, tags }));

    const delivery = {
      pypi: {
        summary: "<strong>PyPI 视图：</strong>点击标签后，目录树会高亮该 package 或 optional install 会涉及的目录。",
        filters: [
          ["pypi-cli", "mfs-cli", "Python SDK + CLI + HTTP client。"],
          ["pypi-server", "mfs-server", "API + local daemon + worker + engine + sources + objects + pipeline + storage。"],
          ["pypi-local", "mfs-cli[local]", "安装体验 shortcut：拉起 mfs-cli 和 mfs-server，但代码边界仍然分开。"],
          ["sdk-other", "other SDKs", "TypeScript/Go/Java SDK，从 OpenAPI 生成或薄封装。"]
        ]
      },
      docker: {
        summary: "<strong>Docker 视图：</strong>点击标签后，目录树会高亮该 image 运行时会用到的目录。",
        filters: [
          ["img-server", "mfs-server", "单容器 server，API + worker，适合 demo、小规模自部署。"],
          ["img-api", "mfs-api", "只跑 HTTP API，负责请求入口、job 创建、轻量 object read。"],
          ["img-worker", "mfs-worker", "只跑后台任务，负责 source sync、index artifacts、retrieval index、export。"]
        ]
      }
    };

    let activeFlow = "daemonFile";
    let activeView = "flow";
    let activeFilter = null;
    let currentStep = 0;
    let timer = null;

    function escapeHtml(value) {
      return value
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    function renderTree() {
      const host = document.getElementById("tree");
      host.innerHTML = "";
      nodes.forEach((node) => {
        const line = document.createElement("div");
        line.className = `tree-line ${node.zone}`;
        line.dataset.id = node.id;
        line.dataset.tags = node.tags.join(",");
        line.innerHTML = `<span>${escapeHtml(node.line)}</span> <span class="comment"># ${escapeHtml(node.comment)}</span>`;
        line.addEventListener("click", () => showNode(node, line));
        host.appendChild(line);
      });
    }

    function renderFlowButtons() {
      const host = document.getElementById("flowButtons");
      host.innerHTML = "";
      Object.entries(flows).forEach(([id, flow]) => {
        const button = document.createElement("button");
        button.type = "button";
        button.dataset.flow = id;
        button.textContent = flow.button;
        button.addEventListener("click", () => selectFlow(id));
        host.appendChild(button);
      });
    }

    function selectFlow(id) {
      stop();
      activeFlow = id;
      activeView = "flow";
      currentStep = 0;
      activeFilter = null;
      document.querySelectorAll("button[data-flow]").forEach((button) => {
        button.classList.toggle("active", button.dataset.flow === id);
      });
      document.getElementById("deliverySummary").style.display = "none";
      document.getElementById("deliveryFilters").innerHTML = "";
      updateViewButtons();
      renderSteps();
      updateFlow(true);
    }

    function renderSteps() {
      const host = document.getElementById("flowSteps");
      host.innerHTML = "";
      flows[activeFlow].steps.forEach(([nodeId, text], index) => {
        const li = document.createElement("li");
        li.dataset.step = String(index);
        li.addEventListener("click", () => {
          currentStep = index;
          updateFlow(true);
        });
        li.innerHTML = `
          <span class="step-num">${index + 1}</span>
          <span>
            <span class="step-path">${escapeHtml(nodeId)}</span>
            ${escapeHtml(text)}
          </span>
        `;
        host.appendChild(li);
      });
    }

    function updateFlow(scrollToStep) {
      const flow = flows[activeFlow];
      const activeNodeId = flow.steps[currentStep][0];
      const done = new Set(flow.steps.slice(0, currentStep).map((step) => step[0]));

      document.getElementById("flowTitle").textContent = flow.title;
      document.getElementById("flowSummary").textContent = `${flow.summary} 第 ${currentStep + 1}/${flow.steps.length} 步：${flow.steps[currentStep][1]}`;
      document.getElementById("progressBar").style.width = `${((currentStep + 1) / flow.steps.length) * 100}%`;

      document.querySelectorAll("#flowSteps li").forEach((li, index) => {
        li.classList.toggle("current", index === currentStep);
        li.classList.toggle("done", index < currentStep);
      });

      const flowIds = new Set(flow.steps.map((step) => step[0]));
      document.querySelectorAll(".tree-line").forEach((line) => {
        const id = line.dataset.id;
        line.classList.toggle("dimmed", !flowIds.has(id));
        line.classList.toggle("path-active", flowIds.has(id));
        line.classList.toggle("done", done.has(id));
        line.classList.toggle("current", id === activeNodeId);
        line.classList.remove("delivery");
        line.querySelectorAll(".badge").forEach((badge) => badge.remove());
        if (id === activeNodeId) {
          const badge = document.createElement("span");
          badge.className = "badge";
          badge.textContent = String(currentStep + 1);
          line.appendChild(badge);
        }
      });

      if (scrollToStep) {
        const line = document.querySelector(`.tree-line[data-id="${activeNodeId}"]`);
        if (line) {
          line.scrollIntoView({ block: "center", behavior: "smooth" });
          const node = nodes.find((item) => item.id === activeNodeId);
          showNode(node, line);
        }
      }
    }

    function showAllForFlow() {
      stop();
      activeView = "flow";
      activeFilter = null;
      updateViewButtons();
      document.getElementById("deliverySummary").style.display = "none";
      document.getElementById("deliveryFilters").innerHTML = "";
      const flow = flows[activeFlow];
      const flowIds = new Set(flow.steps.map((step) => step[0]));
      document.getElementById("flowSummary").textContent = `${flow.summary} 显示这条信息流涉及的全部节点。`;
      document.getElementById("progressBar").style.width = "100%";
      document.querySelectorAll("#flowSteps li").forEach((li) => {
        li.classList.remove("current");
        li.classList.add("done");
      });
      document.querySelectorAll(".tree-line").forEach((line) => {
        const inFlow = flowIds.has(line.dataset.id);
        line.classList.toggle("dimmed", !inFlow);
        line.classList.toggle("path-active", inFlow);
        line.classList.toggle("done", inFlow);
        line.classList.remove("current", "delivery");
        line.querySelectorAll(".badge").forEach((badge) => badge.remove());
      });
    }

    function selectDeliveryView(view) {
      stop();
      activeView = view;
      updateViewButtons();
      document.getElementById("deliverySummary").innerHTML = delivery[view].summary;
      document.getElementById("deliverySummary").style.display = "block";
      activeFilter = delivery[view].filters[0][0];
      renderDeliveryFilters(view);
      applyFilter(view, activeFilter);
    }

    function renderDeliveryFilters(view) {
      const host = document.getElementById("deliveryFilters");
      host.innerHTML = "";
      delivery[view].filters.forEach(([id, label]) => {
        const button = document.createElement("button");
        button.type = "button";
        button.textContent = label;
        button.classList.toggle("active", id === activeFilter);
        button.addEventListener("click", () => {
          activeFilter = id;
          renderDeliveryFilters(view);
          applyFilter(view, id);
        });
        host.appendChild(button);
      });
    }

    function applyFilter(view, id) {
      const item = delivery[view].filters.find(([filterId]) => filterId === id);
      document.getElementById("flowTitle").textContent = view === "pypi" ? "PyPI 交付边界" : "Docker image 边界";
      document.getElementById("flowSummary").textContent = item ? `${item[1]}: ${item[2]}` : "请选择一个标签。";
      document.getElementById("progressBar").style.width = "0";
      document.querySelectorAll("#flowSteps li").forEach((li) => li.classList.remove("current", "done"));
      document.querySelectorAll(".tree-line").forEach((line) => {
        const included = line.dataset.tags.split(",").includes(id);
        line.classList.toggle("dimmed", !included);
        line.classList.toggle("delivery", included);
        line.classList.remove("path-active", "done", "current");
        line.querySelectorAll(".badge").forEach((badge) => badge.remove());
      });
    }

    function updateViewButtons() {
      document.getElementById("viewFlow").classList.toggle("active", activeView === "flow");
      document.getElementById("viewPypi").classList.toggle("active", activeView === "pypi");
      document.getElementById("viewDocker").classList.toggle("active", activeView === "docker");
    }

    function showNode(node, line) {
      document.querySelectorAll(".tree-line").forEach((item) => item.classList.remove("selected"));
      line.classList.add("selected");
      document.getElementById("nodeDetail").innerHTML = `
        <strong>${escapeHtml(node.line.trim())}</strong>
        <p>${escapeHtml(node.comment)}</p>
        <div class="node-path">id: ${escapeHtml(node.id)}</div>
        <div class="node-path">tags: ${escapeHtml(node.tags.join(", "))}</div>
      `;
    }

    function next() {
      currentStep = (currentStep + 1) % flows[activeFlow].steps.length;
      updateFlow(true);
    }

    function prev() {
      currentStep = currentStep === 0 ? flows[activeFlow].steps.length - 1 : currentStep - 1;
      updateFlow(true);
    }

    function play() {
      if (timer) {
        stop();
        return;
      }
      document.getElementById("playSteps").textContent = "暂停";
      timer = window.setInterval(next, 1200);
    }

    function stop() {
      if (timer) {
        window.clearInterval(timer);
        timer = null;
      }
      document.getElementById("playSteps").textContent = "播放";
    }

    document.getElementById("prevStep").addEventListener("click", prev);
    document.getElementById("nextStep").addEventListener("click", next);
    document.getElementById("playSteps").addEventListener("click", play);
    document.getElementById("showAll").addEventListener("click", showAllForFlow);
    document.getElementById("viewFlow").addEventListener("click", () => selectFlow(activeFlow));
    document.getElementById("viewPypi").addEventListener("click", () => selectDeliveryView("pypi"));
    document.getElementById("viewDocker").addEventListener("click", () => selectDeliveryView("docker"));

    renderTree();
    renderFlowButtons();
    selectFlow(activeFlow);
  </script>
</body>
</html>
